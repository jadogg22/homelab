# 1. Access & Security
ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: home.jadogg.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - home.jadogg.com

# 2. Permissions (Required for Kubernetes integration)
enableRbac: true
serviceAccount:
  create: true
  name: homepage

# 3. Dashboard Configuration
config:
  settings:
    title: Jadogg Homelab
    description: Your private cloud, at a glance.
    background:
      image: https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070&auto=format&fit=crop
      blur: sm
      saturate: 75
      brightness: 50
      opacity: 60
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    cardStyle: hairline
    blockStyle: refined
    font: plexData
    iconStyle: theme
    statusStyle: dot
    useEqualHeights: true
    fullWidth: true
    maxGroupColumns: 6
    hideVersion: true
    disableIndexing: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      mobileButtonPosition: bottom-right
    layout:
      Networking & Access:
        style: row
        columns: 3
      Media:
        style: row
        columns: 4
      Automation:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4

  kubernetes:
    mode: cluster

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
          cpu: true
          memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        format:
          timeStyle: short
          dateStyle: long

  services:
    - Networking & Access:
        - AdGuard Home:
            icon: adguard-home.png
            href: https://adguard.jadogg.com
            description: Network DNS Filter
            siteMonitor: https://adguard.jadogg.com
        - Pi-hole:
            icon: pi-hole.png
            href: https://pihole.jadogg.com
            description: Secondary DNS
            siteMonitor: https://pihole.jadogg.com

    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.jadogg.com
            description: Media Server
            siteMonitor: https://jellyfin.jadogg.com
        - Jellyseerr:
            icon: jellyseerr.png
            href: https://requests.jadogg.com
            description: Media Requests
            siteMonitor: https://requests.jadogg.com

    - Automation:
        - qBittorrent:
            icon: qbittorrent.png
            href: https://qb.jadogg.com
            description: Torrent Client
            siteMonitor: https://qb.jadogg.com
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.jadogg.com
            description: Indexer Manager
            siteMonitor: https://prowlarr.jadogg.com
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.jadogg.com
            description: TV Series
            siteMonitor: https://sonarr.jadogg.com
        - Radarr:
            icon: radarr.png
            href: https://radarr.jadogg.com
            description: Movies
            siteMonitor: https://radarr.jadogg.com
        - Lidarr:
            icon: lidarr.png
            href: https://lidarr.jadogg.com
            description: Music
            siteMonitor: https://lidarr.jadogg.com
        - Readarr:
            icon: readarr.png
