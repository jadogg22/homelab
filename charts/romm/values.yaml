controllers:
  main:
    containers:
      main:
        image:
          repository: rommapp/romm
          tag: latest
        env:
          - name: ROMM_DB_DRIVER
            value: mariadb
          - name: DB_HOST
            value: romm-db-mariadb.default.svc.cluster.local
          - name: DB_PORT
            value: "3306"
          - name: DB_NAME
            value: romm
          - name: DB_USER
            value: romm
          - name: DB_PASSWD
            valueFrom:
              secretKeyRef:
                name: mariadb-secrets
                key: mariadb-password
          - name: ROMM_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: mariadb-secrets
                key: mariadb-root-password
          - name: SCAN_WORKERS
            value: "2"
          - name: WEB_SERVER_CONCURRENCY
            value: "2"
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: ENABLE_RESCAN_ON_FILESYSTEM_CHANGE
              value: "true"
            - name: RESCAN_ON_FILESYSTEM_CHANGE_DELAY
              value: "5"
            resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: romm.jadogg.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - romm.jadogg.com

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-replicated
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      main:
        main:
          - path: /romm/config

  resources:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-replicated
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      main:
        main:
          - path: /romm/resources

  assets:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-replicated
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      main:
        main:
          - path: /romm/assets

  library:
    enabled: true
    type: persistentVolumeClaim
    storageClass: truenas-nfs-media
    accessMode: ReadWriteMany
    size: 100Gi
    advancedMounts:
      main:
        main:
          - path: /romm/library

  redis-data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-replicated
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      main:
        main:
          - path: /redis-data
