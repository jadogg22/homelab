# 1. MetalLB Integration
service:
  annotations:
    metallb.io/loadBalancerIPs: 10.0.1.150
  spec:
    externalTrafficPolicy: Local

# 2. Make Traefik the Default
ingressClass:
  enabled: true
  isDefaultClass: true

# 3. Define Ports (UPDATED for Chart v34+)
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    # NEW SYNTAX: "redirectTo" is replaced by this block
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    # TLS configuration remains here
    tls:
      enabled: true
      options: "" # Reference to a TLSOption if needed

# Use the cert-manager-managed wildcard certificate as Traefik's cluster-wide
# fallback. Ingress TLS Secrets are namespace-scoped, so routes should not
# reference this Secret directly from other namespaces.
tlsStore:
  default:
    defaultCertificate:
      secretName: jadogg-wildcard-cert-v2

# 4. Logs/Persistence
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

# 5. Security Context
securityContext:
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

# 6 issues with the storage option.
deployment:
  # This prevents the ReadWriteOnce deadlock
  type: Recreate
